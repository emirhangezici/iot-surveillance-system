{% extends "base.html" %}
{% block content %}
<div class="login-container">
    <h2 class="mb-3" style="color: black;">Login with Admin Account</h2>
    <form action="/login" method="POST">
        <input type="hidden" name="user_type" value="Admin" />
        <input class="mb-3 form-control" type="text" name="username" placeholder="Username" value="{{ username }}" required>
        <input class="mb-3 form-control" type="password" name="password" placeholder="Password" value="{{ password }}" required>
        <button type="submit" class="btn btn-outline-success">
            Login
            <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
            >
                <path
                        d="M15.4857 20H19.4857C20.5903 20 21.4857 19.1046 21.4857 18V6C21.4857 4.89543 20.5903 4 19.4857 4H15.4857V6H19.4857V18H15.4857V20Z"
                        fill="currentColor"
                />
                <path
                        d="M10.1582 17.385L8.73801 15.9768L12.6572 12.0242L3.51428 12.0242C2.96199 12.0242 2.51428 11.5765 2.51428 11.0242C2.51429 10.4719 2.962 10.0242 3.51429 10.0242L12.6765 10.0242L8.69599 6.0774L10.1042 4.6572L16.4951 10.9941L10.1582 17.385Z"
                        fill="currentColor"
                />
            </svg>
        </button>
    </form>

    {% if error %}
    <p class="error-message">{{ error }}</p>
    {% endif %}
</div>
{% endblock %}
