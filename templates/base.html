<!-- base.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Motion Security System</title>
    <style>
        .admin-section{
            position: absolute;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>

    <div class="themeMode position-absolute top-0 start-0 mt-3 ms-3">
            <button id="bd-theme" class="btn btn-warning py-2 px-0 px-lg-2 dropdown-toggle d-flex align-items-center" type="button" aria-expanded="false" data-bs-toggle="dropdown" data-bs-display="static" aria-label="Toggle theme (light)">
                Color Mode
            </button>
            <ul class="dropdown-menu gap-2" aria-labelledby="bd-theme-text">
                <li>
                    <button type="button" class="dropdown-item d-flex align-items-center active gap-3" data-bs-theme-value="light" aria-pressed="true">
                        <svg
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    fill-rule="evenodd"
                                    clip-rule="evenodd"
                                    d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16ZM12 18C15.3137 18 18 15.3137 18 12C18 8.68629 15.3137 6 12 6C8.68629 6 6 8.68629 6 12C6 15.3137 8.68629 18 12 18Z"
                                    fill="currentColor"
                            />
                            <path
                                    fill-rule="evenodd"
                                    clip-rule="evenodd"
                                    d="M11 0H13V4.06189C12.6724 4.02104 12.3387 4 12 4C11.6613 4 11.3276 4.02104 11 4.06189V0ZM7.0943 5.68018L4.22173 2.80761L2.80752 4.22183L5.6801 7.09441C6.09071 6.56618 6.56608 6.0908 7.0943 5.68018ZM4.06189 11H0V13H4.06189C4.02104 12.6724 4 12.3387 4 12C4 11.6613 4.02104 11.3276 4.06189 11ZM5.6801 16.9056L2.80751 19.7782L4.22173 21.1924L7.0943 18.3198C6.56608 17.9092 6.09071 17.4338 5.6801 16.9056ZM11 19.9381V24H13V19.9381C12.6724 19.979 12.3387 20 12 20C11.6613 20 11.3276 19.979 11 19.9381ZM16.9056 18.3199L19.7781 21.1924L21.1923 19.7782L18.3198 16.9057C17.9092 17.4339 17.4338 17.9093 16.9056 18.3199ZM19.9381 13H24V11H19.9381C19.979 11.3276 20 11.6613 20 12C20 12.3387 19.979 12.6724 19.9381 13ZM18.3198 7.0943L21.1923 4.22183L19.7781 2.80762L16.9056 5.6801C17.4338 6.09071 17.9092 6.56608 18.3198 7.0943Z"
                                    fill="currentColor"
                            />
                        </svg>
                        Light
                    </button>
                </li>
                <li>
                    <button type="button" class="dropdown-item d-flex align-items-center gap-3" data-bs-theme-value="dark" aria-pressed="false">
                        <svg
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    fill-rule="evenodd"
                                    clip-rule="evenodd"
                                    d="M12.2256 2.00253C9.59172 1.94346 6.93894 2.9189 4.92893 4.92891C1.02369 8.83415 1.02369 15.1658 4.92893 19.071C8.83418 22.9763 15.1658 22.9763 19.0711 19.071C21.0811 17.061 22.0565 14.4082 21.9975 11.7743C21.9796 10.9772 21.8669 10.1818 21.6595 9.40643C21.0933 9.9488 20.5078 10.4276 19.9163 10.8425C18.5649 11.7906 17.1826 12.4053 15.9301 12.6837C14.0241 13.1072 12.7156 12.7156 12 12C11.2844 11.2844 10.8928 9.97588 11.3163 8.0699C11.5947 6.81738 12.2094 5.43511 13.1575 4.08368C13.5724 3.49221 14.0512 2.90664 14.5935 2.34046C13.8182 2.13305 13.0228 2.02041 12.2256 2.00253ZM17.6569 17.6568C18.9081 16.4056 19.6582 14.8431 19.9072 13.2186C16.3611 15.2643 12.638 15.4664 10.5858 13.4142C8.53361 11.362 8.73568 7.63895 10.7814 4.09281C9.1569 4.34184 7.59434 5.09193 6.34315 6.34313C3.21895 9.46732 3.21895 14.5326 6.34315 17.6568C9.46734 20.781 14.5327 20.781 17.6569 17.6568Z"
                                    fill="currentColor"
                            />
                        </svg>
                        Dark
                    </button>
                </li>
            </ul>
    </div>
    {% block content %}{% endblock %}

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                {% if message.startswith("Error:") %}
                    <script>
                        swal({
                            title: "Error",
                            text: "{{ message }}",
                            icon: "error",
                            button: "OK",
                        });
                    </script>
                {% elif message.startswith("Success:") %}
                    <script>
                        swal({
                            title: "Success",
                            text: "{{ message }}",
                            icon: "success",
                            button: "OK",
                        });
                    </script>
                {% else %}
                    <script>
                        swal({
                            title: "Message",
                            text: "{{ message }}",
                            icon: "info",
                            button: "OK",
                        });
                    </script>
                {% endif %}
            {% endfor %}
        {% endif %}
    {% endwith %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


    <script>
        (() => {
            'use strict'

            // Theme switcher functionality
            // Theme switcher functionality
            const showActiveTheme = (theme) => {
                const themeSwitcher = document.querySelector('#bd-theme');
                const btnToActive = document.querySelector(`[data-bs-theme-value="${theme}"]`);
                const svgOfActiveBtn = btnToActive.querySelector('svg use');

                // Update the active theme icon
                const activeThemeIcon = document.querySelector('.dropdown-item.active svg use');
                if (activeThemeIcon) {
                    activeThemeIcon.setAttribute('href', svgOfActiveBtn.getAttribute('href'));
                }

                // Update the active theme class
                document.querySelectorAll('.dropdown-item').forEach((item) => {
                    item.classList.remove('active');
                });
                btnToActive.classList.add('active');

                // Update the theme
                document.documentElement.setAttribute('data-bs-theme', theme);

                // Tema tercihini yerel depolamada sakla
                localStorage.setItem('theme', theme);
            };

// Tema tercihini yerel depolamadan oku
            const getStoredTheme = () => {
                return localStorage.getItem('theme');
            };

// Initialize the theme switcher
            document.addEventListener('DOMContentLoaded', () => {
                const themeSwitcher = document.querySelector('#bd-theme');

                // Tema tercihini yerel depolamadan oku
                const storedTheme = getStoredTheme();

                // Tema tercihini yerel depolamada sakla
                if (storedTheme) {
                    showActiveTheme(storedTheme);
                } else {
                    // Varsayılan tema
                    showActiveTheme('light');
                }

                // Add event listeners to the theme switcher buttons
                document.querySelectorAll('.dropdown-item').forEach((item) => {
                    item.addEventListener('click', () => {
                        const theme = item.getAttribute('data-bs-theme-value');
                        showActiveTheme(theme);
                    });
                });
            });
        })()
    </script>

</body>
</html>
